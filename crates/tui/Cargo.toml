[package]
name = "calc-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native full-screen terminal frontend."

[[bin]]
name = "calc-tui"
path = "src/main.rs"

[dependencies]
calc-core = { path = "../core" }
calc-shell = { path = "../shell" }
calc-store = { path = "../store", features = ["fs"] }
calc-i18n = { path = "../i18n" }
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
