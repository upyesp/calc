[package]
name = "app"
version = "0.2.0"
description = "epher: a programmable, scriptable calculator — the unified desktop binary"
authors = ["upyesp"]
license = "MIT"
repository = "https://github.com/upyesp/epher"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The unified binary users install on every platform (`epher` on PATH,
# epher.exe on Windows). It hosts every frontend (ADR-0011).
[[bin]]
name = "epher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
epher-core = { path = "../../../crates/core" }
epher-cli = { path = "../../../crates/cli" }
epher-tui = { path = "../../../crates/tui" }
epher-store = { path = "../../../crates/store", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# custom-protocol is required for production: without it tauri's build.rs
# reports dev mode and the app loads devUrl instead of the embedded assets
# (cargo tauri build injects it, plain cargo build does not — keep it here).
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-log = "2"

[dev-dependencies]
tempfile = "3"
