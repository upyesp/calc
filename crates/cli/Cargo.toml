[package]
name = "epher-cli"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native command-line frontend — one-shot evaluation + REPL."

[[bin]]
name = "epher"
path = "src/main.rs"

[dependencies]
epher-core = { path = "../core" }
epher-shell = { path = "../shell" }
epher-store = { path = "../store", features = ["fs"] }
epher-i18n = { path = "../i18n" }
clap = { version = "4", features = ["derive"] }
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
