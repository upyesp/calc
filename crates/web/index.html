<!DOCTYPE html>
<!-- lang must stay in sync with the resolved UI locale when detection lands
     (WCAG 3.1.1); add dir="rtl" when the resolved locale is Arabic. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>epher</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    /* The html element carries the dark background directly so the very
       first painted frame is dark — no white flash on desktop launch. */
    html { background: #141416; }
    :root {
      --bg: #141416;
      --panel: #1d1f22;
      /* field boundary: 3.5:1 vs --bg, 3.1:1 vs --panel (WCAG 1.4.11) */
      --border: #6a6b70;
      --text: #f5f6f7;
      --accent: #2dd4bf;
      /* history text: 6.6:1 vs --bg (WCAG 1.4.3) */
      --muted: #9a9ba2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Fixed viewport, no page scrolling (ADR-0016): the app is one screen —
       answer, input, history, keypad, graph. Growth happens inside fixed
       regions (history, graph pane) that scroll themselves. */
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans", "Noto Sans Arabic", "Noto Sans Devanagari", sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }
    .epher {
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    /* --- pane switching (mobile: the graph is one swipe away) ---------- */
    .pane-switch {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 0 0;
      flex: none;
    }
    .pane-switch button {
      min-height: 44px;
      min-width: 44px;
      padding: 0.4rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .pane-switch button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .panes {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
    }
    .pane {
      flex: 0 0 100%;
      min-width: 100%;
      scroll-snap-align: start;
      min-height: 0;
      display: flex;
      flex-direction: column;
      /* fallback for very short viewports (landscape phones): content can
         overflow the pane and this scrolls — the app page itself never
         does */
      overflow-y: auto;
    }
    /* --- calculator pane: answer / input / history / keypad ------------ */
    #calc-pane {
      padding: 0 0.75rem 0.5rem;
      gap: 0.5rem;
    }
    /* the answer panel: fixed height, always visible (ADR-0016) */
    .answer {
      flex: none;
      min-height: 3.4rem;
      display: flex;
      align-items: center;
      padding: 0.25rem 0.25rem 0;
    }
    .result {
      font-size: 1.6rem;
      font-weight: 300;
      overflow-wrap: anywhere;
      max-height: 3.2rem;
      overflow-y: auto;
      flex: 1;
      /* tables and multi-line outputs need monospace alignment and
         preserved line breaks */
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    form {
      flex: none;
      display: flex;
      gap: 0.5rem;
    }
    input, textarea {
      flex: 1;
      padding: 0.75rem;
      font-size: 1.1rem;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--panel);
      color: var(--text);
    }
    /* The entry is a one-row textarea: single-line input keeps its height,
       Shift+Enter grows the field up to a few lines; pasted scripts stay
       visible and scrollable rather than silently truncating. */
    textarea {
      font-family: inherit;
      line-height: 1.3;
      resize: none;
      overflow-y: auto;
      min-height: 3.2rem;
      max-height: 8rem;
      field-sizing: content;
    }
    /* placeholder: 6.4:1 on --panel (WCAG 1.4.3); it is a hint, the label
       is the aria-label on the input (WCAG 3.3.2) */
    input::placeholder, textarea::placeholder { color: #a1a1a6; }
    /* Keyboard focus indicators (WCAG 2.4.7, 1.4.11): accent ring 9.9:1 vs
       the page background; the button gets an inset dark-teal ring —
       10.0:1 on the accent surface — since an outer ring would blend into
       the button. */
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 3px #0b1512;
    }
    /* No animations exist today; guard any future motion (WCAG 2.3.3). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* --- history: fixed region, scrolls inside (ADR-0016) -------------- */
    .history-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 0.25rem;
      /* keyboard-scrollable region (WCAG 2.1.1) */
      outline: none;
    }
    .history-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: var(--bg);
      padding-block: 0.25rem;
    }
    .history-head h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    .clear-history {
      font-size: 0.9rem;
      font-weight: 500;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.4rem 0.8rem;
      min-height: 44px;
    }
    .history {
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding-bottom: 0.5rem;
    }
    /* --- keypad (ADR-0016) --------------------------------------------- */
    .keypad {
      flex: none;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border);
    }
    /* screen-reader-only text (WCAG 1.3.1: labelled, not duplicated) */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }
    .keypad-tabs {
      display: flex;
      gap: 0.25rem;
      justify-content: center;
      padding-bottom: 0.4rem;
    }
    .keypad-tabs [role="tab"] {
      min-height: 40px;
      min-width: 44px;
      padding: 0.25rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .keypad-tabs [role="tab"][aria-selected="true"] {
      color: var(--text);
      border-color: var(--accent);
      background: var(--panel);
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: minmax(44px, auto);
      align-content: start;
      gap: 0.4rem;
      /* reserve five rows: short tabs leave blank space below instead of
         resizing the history region (ADR-0016) */
      min-height: calc(5 * 44px + 4 * 0.4rem);
      padding: 0 0 0.25rem;
    }
    .keypad-btn {
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .keypad-btn:hover { border-color: var(--accent); color: var(--accent); }
    .keypad-btn.op { color: var(--accent); font-weight: 600; }
    .keypad-btn.fn { font-size: 0.92rem; }
    .keypad-btn.eq {
      grid-column: span 2;
      background: var(--accent);
      color: #0b1512; /* 10.0:1 on the accent (WCAG 1.4.3) */
      font-weight: 700;
      font-size: 1.15rem;
    }
    .keypad-btn.eq:hover { color: #0b1512; border-color: var(--accent); }
    .keypad-btn.act { color: var(--muted); }
    /* --- graph pane ----------------------------------------------------- */
    #graph-pane {
      overflow-y: auto; /* chrome may exceed short viewports; scrolls inside */
      padding: 0.5rem 0.75rem 0.75rem;
      gap: 0.25rem;
    }
    .graph {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
      min-height: 0;
    }
    .graph-empty {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95rem;
      padding: 1rem 0;
    }
    /* The visible text alternative for the plot (WCAG 1.1.1): what is
       plotted, readable by everyone. --muted is 6.6:1 on --bg (1.4.3). */
    .graph-caption {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }
    /* The curve is currentColor = --accent (9.9:1 on --bg); the axes
       blend toward the background at opacity 0.5 to ~5.4:1 — both clear
       the 3:1 graphics threshold (WCAG 1.4.11). */
    .graph svg { color: var(--accent); }
    /* The plot lives in a fixed-size pane (ADR-0016): the SVG fills its
       box and letterboxes to its own aspect ratio (viewBox +
       preserveAspectRatio), so every plot fits the pane. */
    .plot-box {
      flex: 1;
      min-height: 96px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .plot-box svg {
      flex: 1;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
      background: var(--panel);
      /* The 2D plot traces taps and vertical drags; horizontal swipes stay
         the browser's, so swiping back from the graph reaches the
         calculator pane (ADR-0016). The 3D plot below keeps full capture
         — orbiting needs both axes. */
      touch-action: pan-x;
    }
    .graph3d-svg {
      touch-action: none;
    }
    .plot-box svg:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Curve palette (ADR-0014): every color is >= 3:1 on --bg (WCAG
       1.4.11) — accent 9.9:1, #4da3ff 7.0:1, #ffb340 10.3:1, #c39dff
       8.4:1 — and every curve after the first also gets a distinct dash
       pattern so the plots stay distinguishable without color (1.4.1). */
    .curve-0 { --curve: var(--accent); }
    .curve-1 { --curve: #4da3ff; }
    .curve-2 { --curve: #ffb340; }
    .curve-3 { --curve: #c39dff; }
    svg .curve {
      stroke: var(--curve, var(--accent));
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    svg .curve-1 { stroke-dasharray: 8 4; }
    svg .curve-2 { stroke-dasharray: 2 4; }
    svg .curve-3 { stroke-dasharray: 10 3 2 3; }
    svg .fill { stroke: none; }
    svg .grid { stroke: currentColor; opacity: 0.15; }
    svg .axis { stroke: currentColor; opacity: 0.5; }
    svg .tick {
      fill: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    svg .poi { fill: var(--accent); }
    svg .poi-label {
      fill: var(--text);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    svg .trace {
      fill: var(--accent);
      stroke: var(--bg);
      stroke-width: 2;
    }
    .legend {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .swatch {
      display: inline-block;
      width: 2em;
      margin-inline-end: 0.5em;
      border-top: 3px solid var(--curve, var(--accent));
      vertical-align: middle;
    }
    .trace {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .poi-heading {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .poi-list {
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .sliders {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .slider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--text);
    }
    .slider input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      min-height: 24px;
    }
    .slider-value {
      min-width: 4.5em;
      text-align: end;
      color: var(--muted);
    }
    /* The parameter play/pause button (ADR-0015): square, keyboard-visible,
       aria-pressed announces its state. */
    .play-btn {
      width: 2.4rem;
      height: 2.4rem;
      min-width: 2.4rem;
      min-height: 2.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      color: var(--accent);
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    /* The 3D plot section (ADR-0015). */
    .graph3d-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }
    .graph3d-svg {
      display: block;
      color: var(--accent);
      cursor: grab;
    }
    .graph3d-svg:active { cursor: grabbing; }
    .graph3d-hint {
      color: var(--muted);
      font-size: 0.85rem;
    }
    /* Copy-SVG: a quiet secondary button, like install-cli. */
    .copy-svg {
      font-size: 0.95rem;
      font-weight: 500;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      min-height: 48px;
      align-self: flex-start;
      margin-top: 0.75rem;
    }
    /* The macOS "install the epher command" action (ADR-0011): a quiet,
       secondary button — it must not compete with the = button. Contrast
       9.9:1 accent-on-background (WCAG 1.4.3); 48px target (2.5.8). */
    .install-cli {
      font-size: 0.95rem;
      font-weight: 500;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      min-height: 48px;
      align-self: flex-start;
      margin-bottom: 0.75rem;
    }

    /* --- desktop: the graph pane sits beside the calculator (ADR-0016) - */
    @media (min-width: 880px) {
      .pane-switch { display: none; }
      .panes {
        overflow: visible;
        gap: 0;
      }
      /* lift the mobile full-width basis: desktop panes share the row */
      .pane {
        min-width: 0;
        flex-basis: auto;
      }
      #calc-pane {
        flex: 0 0 360px;
        border-inline-end: 1px solid var(--border);
      }
      #graph-pane {
        flex: 1 1 auto;
        padding-inline-start: 1rem;
      }
    }
  </style>
</head>
<body>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <!-- copy-file (not copy-dir): the manifest/sw/icon must land at the dist
       root, where index.html references them — copy-dir would bury them in
       dist/public/ and break installability and the service worker. -->
  <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="public/sw.js" />
  <link data-trunk rel="copy-file" href="public/icon.svg" />
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
  </script>
</body>
</html>
