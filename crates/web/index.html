<!DOCTYPE html>
<!-- lang must stay in sync with the resolved UI locale when detection lands
     (WCAG 3.1.1); add dir="rtl" when the resolved locale is Arabic. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>epher</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      /* field boundary: 3.76:1 vs --bg, 3.08:1 vs --panel (WCAG 1.4.11) */
      --border: #76767a;
      --text: #fff;
      --accent: #ff9f0a;
      /* history text: 5.22:1 vs --bg (WCAG 1.4.3) */
      --muted: #8e8e93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .epher {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      padding: 0.75rem;
      font-size: 1.1rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--panel);
      color: var(--text);
    }
    /* placeholder: 5.42:1 on --panel (WCAG 1.4.3); it is a hint, the label
       is the aria-label on the input (WCAG 3.3.2) */
    input::placeholder { color: #a1a1a6; }
    /* Keyboard focus indicators (WCAG 2.4.7, 1.4.11): accent ring 8.28:1 vs
       the page background; the button gets an inset black ring — 10.22:1 on
       the accent surface — since an outer ring would blend into the button. */
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 3px #000;
    }
    /* No animations exist today; guard any future motion (WCAG 2.3.3). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    button {
      padding: 0.75rem 1.25rem;
      font-size: 1.1rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #000; /* 10.22:1 on the accent (WCAG 1.4.3) */
      font-weight: 600;
      min-width: 48px; /* target size ≥ 24px (WCAG 2.5.8); 48px comfortable */
      min-height: 48px;
    }
    .result {
      font-size: 2rem;
      font-weight: 300;
      min-height: 3rem;
      padding: 0.5rem 0;
      overflow-wrap: anywhere;
      /* tables and multi-line outputs need monospace alignment and
         preserved line breaks */
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    /* The macOS "install the epher command" action (ADR-0011): a quiet,
       secondary button — it must not compete with the = button. Contrast
       8.3:1 accent-on-background (WCAG 1.4.3); 48px target (2.5.8). */
    .install-cli {
      font-size: 0.95rem;
      font-weight: 500;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      min-height: 48px;
      align-self: flex-start;
      margin-bottom: 0.75rem;
    }
    .history {
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .graph {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    /* The visible text alternative for the plot (WCAG 1.1.1): what is
       plotted, readable by everyone. --muted is 5.22:1 on --bg (1.4.3). */
    .graph-caption {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }
    /* The curve is currentColor = --accent (8.28:1 on --bg); the axes
       blend toward the background at opacity 0.4 to ~3.9:1 — both clear
       the 3:1 graphics threshold (WCAG 1.4.11). */
    .graph svg { color: var(--accent); }
    .graph svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      touch-action: none; /* pointer tracing over the plot, not scrolling */
    }
    .graph svg:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Curve palette (ADR-0014): every color is >= 3:1 on --bg (WCAG
       1.4.11) — accent 8.28:1, #4da3ff 6.48:1, #4dd0a0 8.79:1, #c39dff
       7.77:1 — and every curve after the first also gets a distinct dash
       pattern so the plots stay distinguishable without color (1.4.1). */
    .curve-0 { --curve: var(--accent); }
    .curve-1 { --curve: #4da3ff; }
    .curve-2 { --curve: #4dd0a0; }
    .curve-3 { --curve: #c39dff; }
    svg .curve {
      stroke: var(--curve, var(--accent));
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    svg .curve-1 { stroke-dasharray: 8 4; }
    svg .curve-2 { stroke-dasharray: 2 4; }
    svg .curve-3 { stroke-dasharray: 10 3 2 3; }
    svg .fill { stroke: none; }
    svg .grid { stroke: currentColor; opacity: 0.15; }
    svg .axis { stroke: currentColor; opacity: 0.5; }
    svg .tick {
      fill: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    svg .poi { fill: var(--accent); }
    svg .poi-label {
      fill: var(--text);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    svg .trace {
      fill: var(--accent);
      stroke: var(--bg);
      stroke-width: 2;
    }
    .legend {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .swatch {
      display: inline-block;
      width: 2em;
      margin-inline-end: 0.5em;
      border-top: 3px solid var(--curve, var(--accent));
      vertical-align: middle;
    }
    .trace {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .poi-heading {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .poi-list {
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .sliders {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .slider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--text);
    }
    .slider input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      min-height: 24px;
    }
    .slider-value {
      min-width: 4.5em;
      text-align: end;
      color: var(--muted);
    }
    /* Copy-SVG: a quiet secondary button, like install-cli. */
    .copy-svg {
      font-size: 0.95rem;
      font-weight: 500;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      min-height: 48px;
      align-self: flex-start;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <!-- copy-file (not copy-dir): the manifest/sw/icon must land at the dist
       root, where index.html references them — copy-dir would bury them in
       dist/public/ and break installability and the service worker. -->
  <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="public/sw.js" />
  <link data-trunk rel="copy-file" href="public/icon.svg" />
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
  </script>
</body>
</html>
