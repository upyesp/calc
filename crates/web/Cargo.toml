[package]
name = "calc-web"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Yew frontend compiled to wasm32-unknown-unknown — shared by the PWA and the Tauri shell."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calc-core = { path = "../core" }
calc-shell = { path = "../shell" }
calc-store = { path = "../store" }
calc-i18n = { path = "../i18n" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["HtmlInputElement", "Window", "console"] }
