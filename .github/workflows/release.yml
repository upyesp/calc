# Build the unified epher installers for every platform and attach them to
# a GitHub Release. Triggered by pushing a tag:
#   git tag v0.3.0 && git push origin v0.3.0
#
# One download per platform (ADR-0011): each installer carries the unified
# `epher` executable — one-shot CLI, REPL (`epher repl`), piped scripts
# (`epher -`), TUI (`epher tui`), and the desktop GUI (bare `epher` /
# `epher gui`). Windows installs two subsystem builds of the same program
# (console `epher.exe` on PATH; GUI-subsystem `epher-gui.exe` as the
# double-click target — no console flash); macOS/Linux install the single
# binary. On Windows the NSIS installer adds the install directory to the
# user PATH (nsis-hooks.nsh).
#
# Asset names (stable — the landing page links to these):
#   epher-windows-x86_64.exe        Windows installer (NSIS)
#   epher-macos-aarch64.dmg         macOS disk image
#   epher-linux-x86_64.deb          Debian/Ubuntu and derivatives
#   epher-linux-x86_64.rpm          Fedora/RHEL and derivatives
#   epher-linux-x86_64.AppImage     everything else, incl. Arch — runs as-is
# macOS and Windows builds are unsigned; your OS may warn on first launch.
#
# The Linux leg pins ubuntu-22.04 (glibc 2.35) so the shipped binary runs
# on Debian 12, Ubuntu 22.04+, and every newer distro — building on
# ubuntu-latest would require glibc 2.39 and break those systems.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  nsis-hooks-check:
    # Compile-check nsis-hooks.nsh with makensis before any bundle ships.
    # nsis-check.nsi mirrors Tauri's installer.nsi consumption (hooks file
    # included whole; POSTINSTALL expanded in installer context,
    # POSTUNINSTALL inside Section Uninstall — where only `un.` functions
    # may be Called).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check the NSIS hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis crates/tauri-app/src-tauri/nsis-check.nsi

  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.14"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build desktop bundles
        run: cargo tauri build
        working-directory: crates/tauri-app/src-tauri

      - name: Package bundles
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          BUNDLE="$GITHUB_WORKSPACE/target/release/bundle"
          case "${{ runner.os }}" in
            Linux)
              cp "$BUNDLE"/deb/*.deb artifacts/epher-linux-x86_64.deb
              cp "$BUNDLE"/rpm/*.rpm artifacts/epher-linux-x86_64.rpm
              cp "$BUNDLE"/appimage/*.AppImage artifacts/epher-linux-x86_64.AppImage
              ;;
            macOS)
              cp "$BUNDLE"/dmg/*.dmg artifacts/epher-macos-aarch64.dmg
              ;;
            Windows)
              cp "$BUNDLE"/nsis/*-setup.exe artifacts/epher-windows-x86_64.exe
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

  release:
    name: Attach assets to the release
    needs: [desktop, nsis-hooks-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            epher ${{ github.ref_name }} — one install, every frontend.

            Each platform ships a single download containing the one `epher`
            executable: the one-shot CLI, the REPL (`epher repl`), piped
            scripts (`epher -`), the terminal UI (`epher tui`), and the
            desktop app (bare `epher` / `epher gui`).

            - **Windows**: run `epher-windows-x86_64.exe` — the installer puts
              `epher` on your PATH (open a new terminal, then `epher "2 + 2"`).
            - **macOS**: open `epher-macos-aarch64.dmg` and drag epher to
              Applications. In the app, "Install the epher command" puts
              `epher` on your terminal PATH.
            - **Linux**: Debian/Ubuntu → `.deb`; Fedora/RHEL → `.rpm`;
              Arch and everything else → `.AppImage` (chmod +x and run).

            - **Web app (PWA)**: https://epher.org/pwa/ — works
              fully offline.

            > Note: the macOS and Windows builds are unsigned; your OS may
            > warn on first launch.
